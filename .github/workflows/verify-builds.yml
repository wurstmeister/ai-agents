name: Verify Builds

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12

      - name: Verify builds
        run: |
          ./verify-opencode-hashes.sh
          nix flake check --no-build
          nix build .#opencode .#claude-code --no-link
          nix build .#checks.x86_64-linux.opencode-nixos --no-link
