name: Update Agent Versions

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 6 AM UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23

      - name: Run version update script
        id: update
        run: |
          ./update-versions.sh

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No version changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff
          fi

      - name: Verify OpenCode release hashes
        run: ./verify-opencode-hashes.sh

      - name: Verify builds
        if: steps.changes.outputs.changed == 'true'
        run: |
          nix flake check --no-build
          nix build .#opencode .#claude-code --no-link
          nix build .#checks.x86_64-linux.opencode-nixos --no-link

      - name: Commit and push to main
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: update agent versions"
          git push origin HEAD:main
